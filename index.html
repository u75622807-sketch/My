<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Server Load Tester - 1 Sec</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ff00; padding: 20px; display: inline-block; border-radius: 10px; box-shadow: 0 0 15px #00ff00; }
        #log { height: 300px; overflow-y: scroll; border: 1px solid #333; margin-top: 20px; padding: 10px; text-align: left; background: #111; }
        .error { color: #ff0000; font-weight: bold; }
        .success { color: #00ff00; }
        button { padding: 10px 20px; cursor: pointer; background: #00ff00; border: none; font-weight: bold; border-radius: 5px; }
        button:active { transform: scale(0.95); }
        button.stop { background: #ff0000; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h1>🚀 Server Stress Test</h1>
    <p>हर 1 सेकंड में एक मैसेज जाएगा</p>
    <button id="startBtn">टेस्ट शुरू करें (Start Test)</button>
    <button id="stopBtn" class="stop" style="display:none;">रोकें (Stop)</button>
    
    <div id="stats">
        <p>सफल मैसेज: <span id="count">0</span></p>
        <p>सर्वर स्टेटस: <span id="serverStatus">तैयार (Ready)</span></p>
    </div>
</div>

<div id="log"></div>

<script>
    let testInterval;
    let count = 0;
    // URL के अंत में / ज़रूर लगायें
    const RENDER_URL = 'https://my-sweet-brother.onrender.com/'; 

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const log = document.getElementById('log');
    const countSpan = document.getElementById('count');
    const serverStatus = document.getElementById('serverStatus');

    async function sendRequest() {
        count++;
        const startTime = Date.now();
        const currentCount = count;

        try {
            const response = await fetch(RENDER_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    test_id: currentCount,
                    message: "Server Load Check ⚡"
                })
            });

            const duration = (Date.now() - startTime) / 1000;

            if (response.ok) {
                log.innerHTML = `<p class="success">[${currentCount}] ✅ सफलता: ${duration}s</p>` + log.innerHTML;
                countSpan.innerText = currentCount;
                serverStatus.innerText = "ऑनलाइन (Online)";
            } else {
                throw new Error("Response Code: " + response.status);
            }
        } catch (err) {
            log.innerHTML = `<p class="error">[${currentCount}] ❌ एरर: ${err.message}</p>` + log.innerHTML;
            serverStatus.innerText = "डाउन (DOWN)";
            stopTest(); 
        }
    }

    function startTest() {
        count = 0;
        countSpan.innerText = "0";
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        log.innerHTML = "<p>टेस्ट शुरू हो रहा है...</p>";
        // हर 1000ms यानी 1 सेकंड में रिक्वेस्ट भेजेगा
        testInterval = setInterval(sendRequest, 1000); 
    }

    function stopTest() {
        clearInterval(testInterval);
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
    }

    startBtn.addEventListener('click', startTest);
    stopBtn.addEventListener('click', stopTest);
</script>

</body>
</html>
