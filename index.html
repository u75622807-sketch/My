<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Power Test - HD</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0f172a;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 350px;
        }
        h2 { color: var(--primary); margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Server Test</h2>
    <form id="testForm">
        <input type="text" name="user_name" placeholder="अपना नाम लिखें" required>
        <input type="text" name="test_message" value="Speed Test - 1 Second Check" readonly>
        <button type="submit" id="submitBtn">Check Power ⚡</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const form = document.getElementById('testForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const startTime = Date.now(); // समय नोट करें
        status.innerHTML = "भेजा जा रहा है...";
        status.style.color = "#ffcc00";

        const formData = new FormData(form);
        
        try {
            // यहाँ अपना RENDER वाला URL डालें
            const response = await fetch('https://YOUR-RENDER-APP-URL.onrender.com/', {
                method: 'POST',
                body: formData
            });

            const endTime = Date.now(); // रिस्पॉन्स आने का समय
            const duration = (endTime - startTime) / 1000; // सेकंड में

            if (response.ok) {
                status.innerHTML = `✅ सफलता! सर्वर ने ${duration} सेकंड में रिस्पॉन्स दिया।`;
                status.style.color = "#00ff88";
            } else {
                status.innerHTML = "❌ सर्वर एरर! URL चेक करें।";
                status.style.color = "#ff4444";
            }
        } catch (error) {
            status.innerHTML = "❌ कनेक्शन फेल! क्या आपका सर्वर चालू है?";
            status.style.color = "#ff4444";
        }
    });
</script>

</body>
</html>
